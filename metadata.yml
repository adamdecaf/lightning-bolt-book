title:  'Lightning Book of BOLTs'
lang: en
author:
  - The Lightning BOLT authors
  - Compiled by Adam Shannon
keywords: [bitcoin, lightning, bolts, specification]
abstract: |
  The Lightning Book of BOLTs is a readable compilation of the Lightning
  Network Specifications. The BOLTs themselves are unchanged. They are
  grouped here in the order a node actually uses them — connect, open a
  channel, route a payment, settle on-chain — with short chapter
  introductions so you know why you're looking at a given document.

  Credit for the protocol belongs to the original BOLT authors. This book
  is a reading order, not a rewrite.
