name: Publish Book

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Book
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install pandoc weasyprint

      - name: Download BOLTs
        run: |
          make setup
          git -C bolts log -n1

      - name: Build EPUB
        run: make epub

      - name: Build PDF
        timeout-minutes: 10
        run: make pdf

      - name: Require outputs
        run: |
          test -s lightning-bolt-book.epub
          test -s lightning-bolt-book.pdf

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "support@github.com"
          git add -A lightning-bolt-book.epub lightning-bolt-book.pdf ./include/git.md
          if git diff --cached --quiet; then
            echo "No published book changes"
          else
            git commit -m "chore: automated publishing"
            git push origin master
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: book-${{ github.run_id }}
          name: Lightning Book of BOLTs (${{ github.run_number }})
          body: |
            Automated EPUB and PDF from master.
            Site: https://adamdecaf.github.io/lightning-bolt-book/
          files: |
            lightning-bolt-book.epub
            lightning-bolt-book.pdf
          fail_on_unmatched_files: true
          make_latest: true
